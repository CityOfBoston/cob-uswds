<div class="cob-form-group">
  <label class="cob-label" for="file-input-specific">Input accepts only specific file types</label>
  <span class="cob-hint" id="file-input-specific-hint">Select PDF or TXT files</span>
  <input id="file-input-specific"
    class="cob-file-input"
    type="file"
    name="file-input-specific"
    aria-describedby="file-input-specific-hint" accept=".pdf,.txt"
    multiple
  />
</div>
