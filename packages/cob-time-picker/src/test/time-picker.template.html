<form class="cob-form">
  <!-- Label `for` attribute must match input ID -->
  <label class="cob-label" for="appointment-time"
    >Your preferred programming language:
  </label>
  <div class="cob-time-picker">
    <input
      class="cob-input"
      id="appointment-time"
      name="appointment-time"
      type="text"
      value="1:00pm"
      required
    />
  </div>
</form>
